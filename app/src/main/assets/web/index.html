<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1A1B26" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Resenha</title>
    <link rel="stylesheet" href="/shared/base.css" />
</head>
<body>
    <!-- Where the QR always points. Asks which game is active and hands the browser over to it. -->
    <section class="landing">
        <h1>Resenha</h1>
        <p class="subtitle" id="status">Conectando…</p>
    </section>

    <script>
        "use strict";
        (function () {
            const status = document.getElementById("status");
            let leaving = false;

            function connect() {
                if (leaving) return;
                const proto = location.protocol === "https:" ? "wss" : "ws";
                const ws = new WebSocket(`${proto}://${location.host}/ws`);
                ws.onmessage = (e) => {
                    let msg;
                    try {
                        msg = JSON.parse(e.data);
                    } catch (err) {
                        return;
                    }
                    if (msg.type !== "state" || !msg.game) return;
                    leaving = true;
                    ws.close();
                    location.replace("/" + msg.game + "/" + location.search);
                };
                ws.onclose = () => {
                    status.textContent = "Sem conexão com o mestre. Tentando de novo…";
                    setTimeout(connect, 1500);
                };
                ws.onerror = () => ws.close();
            }

            connect();
        })();
    </script>
</body>
</html>
